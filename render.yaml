services:
  - type: web
    name: retr1kze-support-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: SERVICES_JSON
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DB_PATH
        value: data/bot.db
      - key: PORT
        value: 8080
