app = 'retr1kze-support-bot'
primary_region = 'fra'
kill_signal = 'SIGTERM'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  DB_PATH = '/data/bot.db'
  PYTHONUNBUFFERED = '1'

# Постоянный диск для SQLite. Если том не создан вручную — Fly создаст его 1 ГБ.
[mounts]
  source = 'bot_data'
  destination = '/data'
  initial_size = '1'

# Один инстанс, всегда включён: вебхук Telegram не должен ждать холодного старта.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/'

# Самый дешёвый размер: ~$2.5/мес в fra, плюс том $0.15/мес.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
